# Le même pipeline, transposé pour GitLab CI (pour le bureau).
# Mêmes étapes : lint, puis tests, puis déploiement manuel sur GitLab Pages.

default:
  image: node:22

stages:
  - lint
  - test
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

lint:
  stage: lint
  script:
    - npm run lint

test:
  stage: test
  script:
    - npm test

# GitLab Pages publie le dossier "public".
# when: manual joue le rôle de la validation humaine avant la mise en ligne.
pages:
  stage: deploy
  before_script: []
  script:
    - cp -r src public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
